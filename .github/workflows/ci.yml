name: CI/CD bdc-trazabilidad

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  repository_dispatch:
    types: [ cross-repo-test ]

jobs:
  dependency-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bdc-trazabilidad
        uses: actions/checkout@v4
        with:
          path: bdc-trazabilidad

      - name: Checkout llm-wiki-assistant
        uses: actions/checkout@v4
        with:
          repository: julia8873/llm-wiki-assistant
          path: llm-wiki-assistant
          ref: ${{ github.event.client_payload.version || 'main' }}

      - name: Verificar ciclos de dependencia
        run: |
          cd bdc-trazabilidad
          python3 scripts/detect_cycles.py

      - name: Matriz de compatibilidad cruzada
        run: |
          cd bdc-trazabilidad
          chmod +x scripts/test_compat_matrix.sh
          ./scripts/test_compat_matrix.sh

  # Invocación al workflow compartido en llm-wiki-assistant
  deploy-metrics:
    needs: dependency-checks
    uses: julia8873/llm-wiki-assistant/.github/workflows/deploy-reusable.yml@main
    with:
      service_name: 'bdc-trazabilidad-metrics'
      compose_file: 'deploy/docker-compose.prod.yml'
      healthcheck_endpoint: 'http://localhost:8000/health'
