[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metrics-worker"
version = "0.1.0"
description = "Worker de indexacion de metricas OKF"
dependencies = [
    "sqlalchemy",
    "asyncpg",
    "tenacity",
]

[tool.hatch.build.targets.wheel]
packages = ["metrics_worker"]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-mock"
]
