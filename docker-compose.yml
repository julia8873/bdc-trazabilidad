
networks:
  bdc-net:
    external: true

services:
  metrics-api:
    image: moodle-matrix-dev-mapeo-api
    command: ["sh", "-c", "pip install -e . && alembic upgrade head && uvicorn metrics_api.main:app --host 0.0.0.0 --port 8000"]
    volumes:
      - ./metrics-api:/app
      - ./config:/config
    working_dir: /app
    networks:
      - bdc-net
    environment:
      - DATABASE_URL=postgresql://mapeo_user:mapeo_db_pass@postgres:5432/mapeo_db
      - JWT_SECRET_KEY=dev_secret_key_for_local_testing_only
      - MAPEO_API_TOKEN=${MAPEO_API_TOKEN}
      - MOODLE_AUTH_URL=http://moodle-matrix-dev-moodle-1:8080/login/token.php
      - MAPEO_API_URL=http://moodle-matrix-dev-mapeo-api-1:8000
      - ENABLE_DEMO_AUTH=true
      - ENVIRONMENT=dev
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      - PII_SECRET_KEY=${PII_SECRET_KEY}
    env_file:
      - .env

  metrics-worker:
    image: moodle-matrix-dev-mapeo-api
    command: ["sh", "-c", "export PYTHONPATH=/shared-pkg && pip install -e /metrics-api && pip install -e . && python -m metrics_worker.worker"]
    volumes:
      - ./metrics-worker:/app
      - ./metrics-api:/metrics-api
      - ../llm-wiki-assistant/shared-pkg:/shared-pkg
    working_dir: /app
    networks:
      - bdc-net
    environment:
      - MOCK_SERVICES=false
      - DATABASE_URL=postgresql://mapeo_user:mapeo_db_pass@postgres:5432/mapeo_db
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - MAPEO_API_URL=http://moodle-matrix-dev-mapeo-api-1:8000
      - MAPEO_API_TOKEN=${MAPEO_API_TOKEN}

  frontend:
    image: node:20-alpine
    command: ["sh", "-c", "npm install && npm run dev"]
    volumes:
      - ./frontend:/app
    working_dir: /app
    ports:
      - "3001:3000"
    networks:
      - bdc-net
