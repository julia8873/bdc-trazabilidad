[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metrics-api"
version = "0.1.0"
description = "API de métricas"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "pytest>=8.0",
    "requests>=2.31",
    "responses>=0.25",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.0",
    "httpx>=0.25.0",
    "PyJWT>=2.8.0",
    "cryptography>=41.0.0",
    "apscheduler>=3.10.0",
    "pydantic-settings>=2.0.0"
]
